  <title>AnsibleUI</title>

  <!-- Tarayici penceresi cercevesi -->
  <rect x="8" y="10" width="104" height="96" rx="10" ry="10"
        fill="none" stroke="#7F8386" stroke-width="5"/>
  <line x1="8" y1="27" x2="112" y2="27" stroke="#7F8386" stroke-width="4"/>
  <circle cx="19" cy="18.5" r="2.4" fill="#7F8386"/>
  <circle cx="28" cy="18.5" r="2.4" fill="#7F8386"/>
  <circle cx="37" cy="18.5" r="2.4" fill="#7F8386"/>

