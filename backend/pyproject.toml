[project]
name = "ansible-ui-backend"
version = "0.1.0"
description = "AnsibleUI backend — Ansible deposu icin gorsel otomasyon platformu"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Kayipsiz YAML gidis-donusu icin ZORUNLU. PyYAML kullanilmaz.
    "ruamel.yaml>=0.18",
    "Jinja2>=3.1",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "GitPython>=3.1.43",
    "httpx>=0.27",
    "structlog>=24.4",
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.3",
    "APScheduler>=3.10",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "syrupy>=4.8",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-passlib",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — bicimlendirme ve lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins golgeleme
    "C4",        # comprehensions
    "SIM",       # sadelestirme
    "PTH",       # pathlib kullan
    "RUF",       # ruff'a ozel
    "S",         # bandit — guvenlik
    "ASYNC",     # async tuzaklari
    "T20",       # print yasak
    "TRY",       # hata yonetimi
    "LOG",       # loglama
]
ignore = [
    "TRY003",  # uzun hata mesajlari kabul
    "S101",    # assert — testlerde ve invariant kontrollerinde kullanilir
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"alembic/**" = ["E501", "N999"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# ---------------------------------------------------------------------------
# Mypy — strict tip denetimi
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ruamel.*", "git.*", "apscheduler.*", "jose.*", "passlib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "golden: referans Ansible deposuna karsi calisan kayipsizlik testleri",
    "slow: uzun suren testler",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
